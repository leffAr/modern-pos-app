name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the same version as the local dev SDK so CI never jumps
          # to a newer stable with stricter Gradle/AGP requirements.
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build_log.txt

      - name: Prepare APK
        run: |
          mkdir -p output_apk
          APK_FILE=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "Error: No APK file found in build directory!"
            exit 1
          fi
          cp -v "$APK_FILE" output_apk/Modern_POS.apk
          ls -lh output_apk/Modern_POS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ModernPOS-Release-APK
          path: output_apk/Modern_POS.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: "Release v1.3.2 - Modern POS"
          body: |
            ### Fitur Baru v1.3.2
            - **Rincian Total Kas Laci Otomatis**: Perhitungan otomatis kas yang seharusnya ada di laci saat tutup shift (Modal + Penjualan Tunai + Pelunasan Piutang - Pengeluaran).
            - **Indikator Selisih Minus**: Menghitung selisih kas fisik vs kas sistem secara real-time (Minus/Lebih/Pas).
            - **Keterangan / Catatan Kasir**: Input catatan alasan selisih kas saat tutup shift.
            - **Struk Thermal & Laporan Kasir**: Catatan dan rincian kas tercetak di struk thermal, laporan PDF, dan ringkasan WhatsApp.
          files: output_apk/Modern_POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
