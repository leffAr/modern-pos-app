name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Patch all plugins build.gradle
        run: |
          find ~/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk(Version)? (= )?flutter.compileSdkVersion/compileSdkVersion 35/g' {} +

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Rename APK
        if: success()
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Modern_POS.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModernPOS-Release-APK
          path: build/app/outputs/flutter-apk/Modern_POS.apk
          retention-days: 7
