name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Patch all plugins build.gradle
        run: |
          find ~/.pub-cache -name "build.gradle" -exec sed -i -E 's/compileSdk(Version)? (= )?flutter.compileSdkVersion/compileSdkVersion 35/g' {} +

      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Prepare APK
        if: success()
        run: |
          mkdir -p output_apk
          APK_FILE=$(find build/app/outputs -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp -v "$APK_FILE" output_apk/Modern_POS.apk
          else
            echo "Error: No APK file found in build directory!"
            find build -maxdepth 5
            exit 1
          fi
          ls -lh output_apk/

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ModernPOS-Release-APK
          path: output_apk/Modern_POS.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        if: success()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          name: "Release v1.3.2 - Modern POS"
          body: |
            ### Fitur Baru v1.3.2
            - **Rincian Total Kas Laci Otomatis**: Perhitungan otomatis kas yang seharusnya ada di laci saat tutup shift.
            - **Indikator Selisih Minus**: Menghitung selisih kas fisik vs kas sistem secara real-time (Minus/Lebih/Pas).
            - **Keterangan / Catatan Kasir**: Input catatan alasan selisih kas saat tutup shift.
            - **Struk Thermal & Laporan Kasir**: Catatan dan rincian kas tercetak di struk thermal, laporan PDF, dan ringkasan WhatsApp.
          files: output_apk/Modern_POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
